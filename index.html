<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Claude Code session</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; color: #1f2328; line-height: 1.5; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .sub { color: #57606a; margin-top: 0; }
  .btn { display: inline-block; padding: 14px 28px; background: #1f883d; color: #fff !important; text-decoration: none; border-radius: 6px; font-size: 16px; font-weight: 600; margin: 16px 0; }
  .btn:hover { background: #1a7f37; }
  .err { color: #cf222e; background: #ffebe9; padding: 12px 16px; border-radius: 6px; }
  code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-size: 13px; word-break: break-all; }
  pre { background: #f6f8fa; padding: 12px 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  details { margin-top: 24px; color: #57606a; }
  summary { cursor: pointer; font-weight: 600; color: #0969da; }
  hr { border: 0; border-top: 1px solid #d0d7de; margin: 24px 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .sub { color: #8d96a0; }
    code, pre { background: #161b22; color: #e6edf3; }
    summary { color: #2f81f7; }
    hr { border-top-color: #30363d; }
    .err { color: #f85149; background: #2d1417; }
  }
</style>
</head>
<body>
<h1>Resume Claude Code session</h1>
<p class="sub" id="sub">Open this conversation in a fresh local Claude Code session.</p>

<div id="ok" style="display:none">
  <p><a id="btn" class="btn" href="#">Resume in Claude</a></p>
  <hr>
  <details>
    <summary>It didn't work?</summary>
    <p><strong>First time on this machine?</strong> One paste does everything (install + resume):</p>
    <pre><code id="install-cmd"></code></pre>
    <p><strong>Or run just the resume</strong> if you have the tool installed:</p>
    <pre><code id="cmd"></code></pre>
    <p><strong>Source URL:</strong></p>
    <pre><code id="src"></code></pre>
  </details>
</div>

<div id="err" class="err" style="display:none"></div>

<script>
(function () {
  var raw = (new URLSearchParams(location.search)).get('url') || location.hash.slice(1);
  if (!raw) {
    document.getElementById('err').textContent = 'No session URL provided. This page expects a ?url=<https-url> query parameter (or #<https-url> hash).';
    document.getElementById('err').style.display = 'block';
    return;
  }
  var url;
  try { url = decodeURIComponent(raw); } catch (e) { url = raw; }

  // Strict allowlist: only accept Block Artifactory user-submitted-artifacts session shares.
  var ALLOW = 'https://artifactory.sqprod.co/artifactory/user-submitted-artifacts/claude-sessions/';
  if (url.indexOf(ALLOW) !== 0) {
    document.getElementById('err').textContent = 'Refusing to bounce: URL is not under ' + ALLOW;
    document.getElementById('err').style.display = 'block';
    return;
  }

  var claudeUrl = 'claude-resume://' + url.slice('https://'.length);
  document.getElementById('ok').style.display = 'block';
  document.getElementById('btn').href = claudeUrl;
  document.getElementById('cmd').textContent = 'claude-resume ' + url;
  document.getElementById('src').textContent = url;
  document.getElementById('install-cmd').textContent =
    'sq agents skills add claude-session-share && bash ~/.agents/skills/claude-session-share/install.sh ' + url;

  // Best-effort auto-navigate. Most browsers block without a user gesture, but
  // Safari and some configs let it through — try anyway.
  try { window.location.replace(claudeUrl); } catch (e) {}
})();
</script>
</body>
</html>
